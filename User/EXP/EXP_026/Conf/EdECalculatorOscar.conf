# The excitation energies in this file are in MeV.
# Each reaction owns a separate EdECalculator instance.

# Pure elastic scattering from the Fe target. RESOLUTION gives the additional
# symmetric E and dE half-widths in MeV used to make the region visible.
REACTION Fe_elastic
LAYER TARGET
TARGET 54 26
ELASTIC
RESOLUTION 0.500 0.100
BRANCH BOTH
LINE_WIDTH 2
END_REACTION

# Pure elastic scattering from the Nb backing/degrader.
REACTION Nb_elastic
LAYER BACKING
TARGET 93 41
ELASTIC
RESOLUTION 0.500 0.100
BRANCH BOTH
LINE_WIDTH 2
END_REACTION

# 16O + 54Fe -> 14C + 56Ni
REACTION Fe_2p_strip
LAYER TARGET
TARGET 54 26
TRANSFER 2 2
GRID 0 10 0.250
# Known levels can be plotted as a second, marker-only sequence, for example:
# LEVELS 0.000 2.701 3.078
BRANCH BOTH
LINE_STYLE 1
LINE_WIDTH 2
MARKER_STYLE 20
MARKER_SIZE 0.8
END_REACTION

# 16O + 93Nb -> 14C + 95Tc in the backing
REACTION Nb_2p_strip
LAYER BACKING
TARGET 93 41
TRANSFER 2 2
GRID 0 50 0.250
BRANCH BOTH
LINE_STYLE 1
LINE_WIDTH 2
MARKER_STYLE 21
MARKER_SIZE 0.8
END_REACTION

