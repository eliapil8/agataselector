# The excitation energies in this file are in MeV.
# Each reaction owns a separate EdECalculator instance.

# 16O + 54Fe -> 14C + 56Ni
REACTION Fe_2p_strip
LAYER TARGET
TARGET 54 26
TRANSFER 2 2
GRID 0 50 0.250
# Known levels can be plotted as a second, marker-only sequence, for example:
# LEVELS 0.000 2.701 3.078
BRANCH BOTH
LINE_STYLE 1
LINE_WIDTH 2
MARKER_STYLE 20
MARKER_SIZE 0.8
END_REACTION

