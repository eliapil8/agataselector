#Configuration file for the selector
#Format: | KEYWORD | value(s) | Unit of measure | Comment |
#Comments are ignored unit of measure # means none
#Coordination system:   x is poining to the left (AGATA side)
#                       y is pointing up
#                       z is beam direction 
#-----------------------------------------------------------
#
#-----------------------------------------------------------
DETECTORS_PRESENT
DANTE               YES      # Dante is present YES/NO
PRISMA              YES      # Prisma is present YES/NO
LABR                YES      # Spider is present YES/NO
AGATA               YES      # Agata is present YES/NO
#-----------------------------------------------------------
#
#-----------------------------------------------------------
REPLAY_CONF
REPLAY_DIR_PATTERN  run_allAnc_shift87_           # Replay directory pattern
TREE_NAME           TreeMaster      # Input tree name
IN_FILE_PATTERN     Tree_           # Input file pattern
CONF_PATH           ./Conf          # Replay conf folder path
OUT_PATH            ./Out           # Output path
OUT_FILE_PATTERN    run_            # Output file pattern
IN_SUB_PATH         /Out_keep/Analysis   # Input sub path
IN_PATH             ./Data          # Input path
IN_PRISMA_PATH      ./PrismaData    # Input Prisma path for merge
