#
#-----------------------------------------------------------
TARGET_CONF
DEG_DENSITY     0 mg/cm^3   # Degrader density in mg/cm^3
DEG_DISTANCE    0 um        # Degrader distance in um
DEG_THICKNESS   0 um        # Degrader thickness in um
ROTATIONZ       0 deg       # Target rotation on the Z axis in degrees
ROTATIONX       0 deg       # Target rotation on the X axis in degrees
DENSITY         0 mg/cm^3   # Target density in mg/cm^3
TILT            0 deg       # Target tilt in degrees
THICKNESS       2 um        # Target thickness in um
