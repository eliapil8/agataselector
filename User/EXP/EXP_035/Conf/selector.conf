DETECTORS_PRESENT
DANTE			NO	#		Dante is present YES/NO
LABR			NO	#		Labr is present YES/NO
PRISMA			NO	#		Prisma is present YES/NO
EUCLIDES			NO	#		Euclides is present YES/NO
SPIDER			NO	#		Spider is present YES/NO
AGATA			YES	#		Agata is present YES/NO
#-----------------------------------------------------------

#-----------------------------------------------------------
REPLAY_CONF
SUM_FILE_PATTERN			sum	#		Hadded file pattern
REPLAY_DIR_PATTERN			run_	#		Replay directory pattern
TREE_NAME			TreeMaster	#		Input tree name
IN_FILE_PATTERN			Tree_	#		Input file pattern
CONF_PATH			./Conf	#		Replay conf folder path
ENABLED_HISTOS			enabled_histos.conf	#		File name with list of enabled histograms
